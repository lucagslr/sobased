openapi: 3.0.3
info:
  title: SOBASED API
  version: 1.0.0
paths:
  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: 'First call made by the front: sets the csrftoken cookie.'
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Username + password login with two rate limits.

        - per IP: DRF scoped throttle "login" (5/min);
        - per username: only FAILED attempts are counted (10/hour), so an attacker
          cannot lock a victim out just by spamming the endpoint with successes,
          and a legitimate user is never blocked by their own logins.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/password/change/:
    post:
      operationId: auth_password_change_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/password/reset/:
    post:
      operationId: auth_password_reset_create
      description: 'Base for endpoints reachable without a session: CSRF + scoped
        throttle.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/password/reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: 'Base for endpoints reachable without a session: CSRF + scoped
        throttle.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: 'Base for endpoints reachable without a session: CSRF + scoped
        throttle.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/session/:
    get:
      operationId: auth_session_retrieve
      description: |-
        Who am I? Always 200, so that a signed-out visitor does not produce a
        401 error in the browser console. Also sets the CSRF cookie: it is the
        first call the front makes.
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/auth/verify-email/:
    post:
      operationId: auth_verify_email_create
      description: 'Base for endpoints reachable without a session: CSRF + scoped
        throttle.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/verify-email/resend/:
    post:
      operationId: auth_verify_email_resend_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/checklist-items/:
    get:
      operationId: checklist_items_list
      description: |-
        Checklist items. `?task=` lists a checklist, `?pinned=true` feeds the
        "Todo épinglées" widget (open items of open tasks).
      tags:
      - checklist-items
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChecklistItem'
          description: ''
    post:
      operationId: checklist_items_create
      description: |-
        Checklist items. `?task=` lists a checklist, `?pinned=true` feeds the
        "Todo épinglées" widget (open items of open tasks).
      parameters:
      - in: query
        name: task
        schema:
          type: integer
        required: true
      tags:
      - checklist-items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChecklistItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChecklistItemRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItem'
          description: ''
  /api/checklist-items/{id}/:
    patch:
      operationId: checklist_items_partial_update
      description: |-
        Checklist items. `?task=` lists a checklist, `?pinned=true` feeds the
        "Todo épinglées" widget (open items of open tasks).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) checklist
          item.
        required: true
      tags:
      - checklist-items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedChecklistItemRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedChecklistItemRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecklistItem'
          description: ''
    delete:
      operationId: checklist_items_destroy
      description: |-
        Checklist items. `?task=` lists a checklist, `?pinned=true` feeds the
        "Todo épinglées" widget (open items of open tasks).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) checklist
          item.
        required: true
      tags:
      - checklist-items
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/dashboard/summary/:
    get:
      operationId: dashboard_summary_retrieve
      description: Data of every widget in one call (one round trip, one consistent
        "now").
      parameters:
      - in: query
        name: only_mine
        schema:
          type: boolean
      - in: query
        name: project
        schema:
          type: array
          items:
            type: integer
        description: Sous-projets inclus
      - in: query
        name: tag
        schema:
          type: array
          items:
            type: integer
      - in: query
        name: view
        schema:
          type: integer
        description: Filtres d'une vue enregistrée
      - in: query
        name: workspace
        schema:
          type: array
          items:
            type: integer
      tags:
      - dashboard
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'
          description: ''
  /api/dashboard/views/:
    get:
      operationId: dashboard_views_list
      description: |-
        My saved views ("Perso", "100SATIONS", "École"): filters + layout.

        A user only ever sees and edits their own views. The first call creates
        "Mon dashboard", so that the layout can be saved before any view is named.
      tags:
      - dashboard
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DashboardView'
          description: ''
    post:
      operationId: dashboard_views_create
      description: |-
        My saved views ("Perso", "100SATIONS", "École"): filters + layout.

        A user only ever sees and edits their own views. The first call creates
        "Mon dashboard", so that the layout can be saved before any view is named.
      tags:
      - dashboard
      requestBody:
        content:
          application/json:
            schema:
