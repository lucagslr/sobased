        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectNode'
          description: ''
  /api/tags/:
    get:
      operationId: tags_list
      description: |-
        Tags of a workspace.

        Read: anyone in the workspace. Create: editors of the workspace or of any
        of its projects (they tag their own content). Rename / delete: workspace
        editors only, because it affects everybody's content.
      tags:
      - tags
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'
          description: ''
    post:
      operationId: tags_create
      description: |-
        Tags of a workspace.

        Read: anyone in the workspace. Create: editors of the workspace or of any
        of its projects (they tag their own content). Rename / delete: workspace
        editors only, because it affects everybody's content.
      tags:
      - tags
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TagRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
          description: ''
  /api/tags/{id}/:
    get:
      operationId: tags_retrieve
      description: |-
        Tags of a workspace.

        Read: anyone in the workspace. Create: editors of the workspace or of any
        of its projects (they tag their own content). Rename / delete: workspace
        editors only, because it affects everybody's content.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) tag.
        required: true
      tags:
      - tags
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
          description: ''
    patch:
