openapi: 3.0.3
info:
  title: SOBASED API
  version: 1.0.0
paths:
  /api/asset-comments/{id}/:
    patch:
      operationId: asset_comments_partial_update
      description: |-
        Edit (author), delete (author or admin), resolve / reopen a thread
        (its author or an editor).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) asset comment.
        required: true
      tags:
      - asset-comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssetCommentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAssetCommentRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetComment'
          description: ''
    delete:
      operationId: asset_comments_destroy
      description: |-
        Edit (author), delete (author or admin), resolve / reopen a thread
        (its author or an editor).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) asset comment.
        required: true
      tags:
      - asset-comments
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
