  /api/me/avatar/:
    put:
      operationId: me_avatar_update
      tags:
      - me
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                avatar:
                  type: string
                  format: binary
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
    delete:
      operationId: me_avatar_destroy
      tags:
      - me
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/memberships/:
    get:
      operationId: memberships_list
      description: |-
        Who has access to a workspace or a project, and managing it.

        - list: any real member of the scope (viewer and up). Shells see nothing.
        - create / update / delete: admins of the scope the membership is on.
          An admin may change or remove another admin, never the owner, and nobody
          can grant "owner" here (SPEC §6).
        - anyone may delete their own membership, except the owner.
      parameters:
      - in: query
        name: project
        schema:
          type: integer
        description: 'Portée : un projet'
      - in: query
        name: workspace
        schema:
          type: integer
        description: 'Portée : un espace'
      tags:
      - memberships
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EffectiveMember'
          description: ''
    post:
      operationId: memberships_create
      description: |-
        Who has access to a workspace or a project, and managing it.

        - list: any real member of the scope (viewer and up). Shells see nothing.
        - create / update / delete: admins of the scope the membership is on.
          An admin may change or remove another admin, never the owner, and nobody
          can grant "owner" here (SPEC §6).
        - anyone may delete their own membership, except the owner.
      tags:
      - memberships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MembershipCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResult'
          description: ''
  /api/memberships/{id}/:
