components:
  schemas:
    Blocker:
      type: object
      description: |-
        A task blocking another one. For a blocker the user cannot see, only
        `id` and `is_open` are filled: enough for the padlock, nothing more.
      properties:
        id:
          type: integer
        visible:
          type: boolean
        title:
          type: string
          nullable: true
        status:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/TaskStatusEnum'
          - $ref: '#/components/schemas/NullEnum'
        project_name:
          type: string
          nullable: true
        is_open:
          type: boolean
      required:
      - id
      - is_open
      - project_name
      - status
      - title
      - visible
    BlockerCandidate:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          $ref: '#/components/schemas/TaskStatusEnum'
        project_name:
          type: string
      required:
      - id
      - project_name
      - status
      - title
    Breadcrumb:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        color:
          type: string
        is_shell:
          type: boolean
      required:
      - color
      - id
      - is_shell
      - name
    ChecklistItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        task:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 240
        done:
          type: boolean
        pinned:
          type: boolean
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
        done_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - done
      - done_at
      - id
      - pinned
      - position
      - task
      - title
    ChecklistItemRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 240
        done:
          type: boolean
        pinned:
          type: boolean
        position:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - title
    DirectMembership:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        can_view_finance:
          type: boolean
        can_edit_finance:
          type: boolean
      required:
      - can_edit_finance
      - can_view_finance
      - id
      - role
    EffectiveMember:
      type: object
      description: 'One person with access to a scope: effective rights and where
        they come from.'
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
        role:
          $ref: '#/components/schemas/RoleEnum'
        can_view_finance:
          type: boolean
        can_edit_finance:
          type: boolean
        direct:
          allOf:
          - $ref: '#/components/schemas/DirectMembership'
          nullable: true
        inherited_from:
          type: array
          items:
            $ref: '#/components/schemas/InheritedGrant'
      required:
      - can_edit_finance
      - can_view_finance
      - direct
      - inherited_from
      - role
      - user
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    GrantableRoleEnum:
      enum:
      - viewer
      - commenter
      - editor
      - admin
      type: string
      description: |-
        * `viewer` - Lecteur
        * `commenter` - Commentateur
        * `editor` - Éditeur
        * `admin` - Admin
    InheritedGrant:
      type: object
      properties:
        scope_type:
          $ref: '#/components/schemas/ScopeTypeEnum'
        scope_id:
          type: integer
        scope_name:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - role
      - scope_id
      - scope_name
      - scope_type
    Invitation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        workspace:
          type: integer
          readOnly: true
          nullable: true
        project:
          type: integer
          readOnly: true
          nullable: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        can_view_finance:
          type: boolean
          readOnly: true
        can_edit_finance:
          type: boolean
          readOnly: true
        invited_by:
          allOf:
          - $ref: '#/components/schemas/PublicUser'
          readOnly: true
        expires_at:
          type: string
          format: date-time
          readOnly: true
        is_pending:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - can_edit_finance
      - can_view_finance
      - created_at
      - email
      - expires_at
      - id
      - invited_by
      - is_pending
      - project
      - role
      - workspace
    InvitationAcceptRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
      required:
      - token
    InvitationLookup:
      type: object
      description: What the (public) acceptance page shows about an invitation.
      properties:
        email:
          type: string
          format: email
        scope_type:
          $ref: '#/components/schemas/ScopeTypeEnum'
        scope_name:
          type: string
        role:
          $ref: '#/components/schemas/RoleEnum'
        invited_by:
          type: string
          nullable: true
        is_pending:
          type: boolean
      required:
      - email
      - invited_by
      - is_pending
      - role
