      tags:
      - project-types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectTypeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProjectTypeRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectType'
          description: ''
    delete:
