  /api/events/:
    get:
      operationId: events_list
      description: |-
        Mixin for viewsets whose objects belong to a project.

        Declare roles with:
            read_role   = Role.VIEWER   (list, retrieve)
            write_role  = Role.EDITOR   (create, update, partial_update, destroy)
            action_roles = {"resolve": Role.COMMENTER}   (per-action overrides)
            finance = "" | "rw"  ("rw": reads need can_view_finance, writes
                                  need can_edit_finance, on top of the role)

        The model's default manager must come from ProjectScopedQuerySet.
      parameters:
      - in: query
        name: contact
        schema:
          type: integer
      - in: query
        name: include_descendants
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: participant
        schema:
          type: string
      - in: query
        name: project
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: tag
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: array
          items:
            type: string
            enum:
            - class
            - exam
            - live
            - meeting
            - other
            - release
            - release_party
            - shooting
        description: |-
          * `meeting` - RDV
          * `live` - Date live
          * `shooting` - Tournage
          * `release` - Release
          * `release_party` - Release party
          * `class` - Cours
          * `exam` - Examen
          * `other` - Autre
        explode: true
        style: form
      - in: query
        name: window_end
        schema:
          type: string
          format: date-time
      - in: query
        name: window_start
        schema:
          type: string
          format: date-time
      - in: query
        name: workspace
        schema:
          type: number
      tags:
      - events
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEventList'
          description: ''
    post:
      operationId: events_create
      description: |-
        Mixin for viewsets whose objects belong to a project.

        Declare roles with:
            read_role   = Role.VIEWER   (list, retrieve)
            write_role  = Role.EDITOR   (create, update, partial_update, destroy)
            action_roles = {"resolve": Role.COMMENTER}   (per-action overrides)
            finance = "" | "rw"  ("rw": reads need can_view_finance, writes
                                  need can_edit_finance, on top of the role)

        The model's default manager must come from ProjectScopedQuerySet.
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
