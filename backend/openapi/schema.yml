        description: 'Portée : un espace'
      tags:
      - invitations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
          description: ''
  /api/invitations/{id}/:
    delete:
      operationId: invitations_destroy
      description: Pending invitations of a scope. Admins only (they contain e-mails).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) invitation.
        required: true
      tags:
      - invitations
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/invitations/{id}/resend/:
    post:
      operationId: invitations_resend_create
      description: New link, new 14 days. The previous link stops working.
      parameters:
