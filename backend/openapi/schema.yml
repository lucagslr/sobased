  /api/tasks/:
    get:
      operationId: tasks_list
      description: |-
        Mixin for viewsets whose objects belong to a project.

        Declare roles with:
            read_role   = Role.VIEWER   (list, retrieve)
            write_role  = Role.EDITOR   (create, update, partial_update, destroy)
            action_roles = {"resolve": Role.COMMENTER}   (per-action overrides)
            finance = "" | "rw"  ("rw": reads need can_view_finance, writes
                                  need can_edit_finance, on top of the role)

        The model's default manager must come from ProjectScopedQuerySet.
      parameters:
      - in: query
        name: assignee
        schema:
          type: string
      - in: query
        name: due_after
        schema:
          type: string
          format: date-time
      - in: query
        name: due_before
        schema:
          type: string
          format: date-time
      - in: query
        name: include_descendants
        schema:
          type: boolean
      - in: query
        name: no_date
        schema:
          type: boolean
      - in: query
        name: open
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Quel champ utiliser pour classer les résultats.
        schema:
          type: string
      - in: query
        name: overdue
        schema:
          type: boolean
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: priority
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - cancelled
            - done
            - in_progress
            - to_validate
            - todo
        description: |-
          * `todo` - À faire
          * `in_progress` - En cours
          * `to_validate` - À valider
          * `done` - Terminé
          * `cancelled` - Annulé
        explode: true
        style: form
      - in: query
        name: tag
        schema:
          type: array
          items:
            type: integer
        explode: true
        style: form
      - in: query
        name: window_end
        schema:
          type: string
          format: date-time
      - in: query
        name: window_start
        schema:
          type: string
          format: date-time
      - in: query
        name: workspace
        schema:
          type: number
      tags:
      - tasks
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
