        required: true
      tags:
      - dashboard
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardView'
          description: ''
    patch:
      operationId: dashboard_views_partial_update
      description: |-
        My saved views ("Perso", "100SATIONS", "École"): filters + layout.

        A user only ever sees and edits their own views. The first call creates
