  /api/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: 'First call made by the front: sets the csrftoken cookie.'
      tags:
      - auth
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Username + password login with two rate limits.

        - per IP: DRF scoped throttle "login" (5/min);
        - per username: only FAILED attempts are counted (10/hour), so an attacker
          cannot lock a victim out just by spamming the endpoint with successes,
          and a legitimate user is never blocked by their own logins.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
