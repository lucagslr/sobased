  /api/memberships/:
    get:
      operationId: memberships_list
      description: |-
        Who has access to a workspace or a project, and managing it.

        - list: any real member of the scope (viewer and up). Shells see nothing.
        - create / update / delete: admins of the scope the membership is on.
          An admin may change or remove another admin, never the owner, and nobody
          can grant "owner" here (SPEC §6).
        - anyone may delete their own membership, except the owner.
      parameters:
      - in: query
        name: project
        schema:
          type: integer
        description: 'Portée : un projet'
      - in: query
        name: workspace
        schema:
          type: integer
        description: 'Portée : un espace'
      tags:
      - memberships
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EffectiveMember'
          description: ''
    post:
      operationId: memberships_create
      description: |-
        Who has access to a workspace or a project, and managing it.

        - list: any real member of the scope (viewer and up). Shells see nothing.
        - create / update / delete: admins of the scope the membership is on.
          An admin may change or remove another admin, never the owner, and nobody
          can grant "owner" here (SPEC §6).
        - anyone may delete their own membership, except the owner.
      tags:
      - memberships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MembershipCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MembershipCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteResult'
          description: ''
  /api/memberships/{id}/:
    patch:
      operationId: memberships_partial_update
      description: |-
        Who has access to a workspace or a project, and managing it.

        - list: any real member of the scope (viewer and up). Shells see nothing.
        - create / update / delete: admins of the scope the membership is on.
          An admin may change or remove another admin, never the owner, and nobody
          can grant "owner" here (SPEC §6).
        - anyone may delete their own membership, except the owner.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) membership.
        required: true
      tags:
      - memberships
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedMembershipUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedMembershipUpdateRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipUpdate'
          description: ''
    delete:
      operationId: memberships_destroy
      description: |-
        Who has access to a workspace or a project, and managing it.

        - list: any real member of the scope (viewer and up). Shells see nothing.
        - create / update / delete: admins of the scope the membership is on.
          An admin may change or remove another admin, never the owner, and nobody
          can grant "owner" here (SPEC §6).
        - anyone may delete their own membership, except the owner.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) membership.
        required: true
      tags:
      - memberships
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/project-types/:
    get:
      operationId: project_types_list
      description: 'Project types of a workspace. Read: anyone in it. Write: admins.'
      tags:
      - project-types
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectType'
          description: ''
    post:
      operationId: project_types_create
      description: 'Project types of a workspace. Read: anyone in it. Write: admins.'
      tags:
      - project-types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectTypeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectTypeRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectType'
          description: ''
  /api/project-types/{id}/:
    get:
      operationId: project_types_retrieve
      description: 'Project types of a workspace. Read: anyone in it. Write: admins.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) project type.
        required: true
      tags:
      - project-types
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectType'
          description: ''
    patch:
      operationId: project_types_partial_update
      description: 'Project types of a workspace. Read: anyone in it. Write: admins.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) project type.
        required: true
      tags:
      - project-types
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectTypeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProjectTypeRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectType'
          description: ''
    delete:
      operationId: project_types_destroy
      description: 'Project types of a workspace. Read: anyone in it. Write: admins.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) project type.
        required: true
      tags:
      - project-types
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/projects/:
    post:
      operationId: projects_create
      description: 'Projects. There is no flat list: navigation uses the `tree` action.'
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProjectRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/{id}/:
    get:
      operationId: projects_retrieve
      description: Full project, or the reduced "shell" view of an ancestor.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) project.
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    patch:
      operationId: projects_partial_update
      description: 'Projects. There is no flat list: navigation uses the `tree` action.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) project.
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProjectRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    delete:
      operationId: projects_destroy
      description: 'Sub-project: editor of the PARENT. Root project: owner (D5).'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) project.
        required: true
      tags:
      - projects
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/projects/{id}/move/:
    post:
      operationId: projects_move_create
      description: 'Re-parent inside the workspace: admin here, editor on the target.'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) project.
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveProjectRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MoveProjectRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/{id}/transfer-ownership/:
