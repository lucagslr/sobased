        name: priority
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
            enum:
            - cancelled
            - done
            - in_progress
            - to_validate
            - todo
        description: |-
          * `todo` - À faire
          * `in_progress` - En cours
          * `to_validate` - À valider
          * `done` - Terminé
          * `cancelled` - Annulé
