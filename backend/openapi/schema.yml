      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) invitation.
        required: true
      tags:
      - invitations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
          description: ''
  /api/invitations/accept/:
    post:
      operationId: invitations_accept_create
      description: Pending invitations of a scope. Admins only (they contain e-mails).
      tags:
      - invitations
      requestBody:
        content:
          application/json:
            schema:
