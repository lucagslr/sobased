components:
  schemas:
    DirectMembership:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        can_view_finance:
          type: boolean
        can_edit_finance:
          type: boolean
      required:
      - id
      - role
    EffectiveMember:
      type: object
      description: 'One person with access to a scope: effective rights and where
        they come from.'
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
        role:
          $ref: '#/components/schemas/RoleEnum'
        can_view_finance:
          type: boolean
        can_edit_finance:
          type: boolean
        direct:
          allOf:
          - $ref: '#/components/schemas/DirectMembership'
          nullable: true
        inherited_from:
          type: array
          items:
            $ref: '#/components/schemas/InheritedGrant'
      required:
      - can_edit_finance
      - can_view_finance
      - direct
      - inherited_from
      - role
      - user
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    GrantableRoleEnum:
      enum:
      - viewer
      - commenter
      - editor
      - admin
      type: string
      description: |-
        * `viewer` - Lecteur
        * `commenter` - Commentateur
        * `editor` - Éditeur
        * `admin` - Admin
    InheritedGrant:
      type: object
      properties:
