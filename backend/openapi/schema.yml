        throttle.'
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/auth/verify-email/resend/:
    post:
      operationId: auth_verify_email_resend_create
      tags:
      - auth
      security:
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/health/:
    get:
      operationId: health_retrieve
      description: 'Used by monitoring and by the deploy script: are Postgres and
        Redis up?'
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/invitations/:
    get:
      operationId: invitations_list
      description: Pending invitations of a scope. Admins only (they contain e-mails).
      parameters:
      - in: query
        name: project
        schema:
          type: integer
        description: 'Portée : un projet'
      - in: query
        name: workspace
        schema:
          type: integer
        description: 'Portée : un espace'
      tags:
      - invitations
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
          description: ''
  /api/invitations/{id}/:
    delete:
      operationId: invitations_destroy
      description: Pending invitations of a scope. Admins only (they contain e-mails).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) invitation.
        required: true
      tags:
      - invitations
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/invitations/{id}/resend/:
