  /api/projects/tree/:
    get:
      operationId: projects_tree_list
      description: Every node the user can see, shells included, as a flat list.
      parameters:
      - in: query
        name: include_archived
        schema:
          type: boolean
      - in: query
        name: workspace
        schema:
          type: integer
        description: Limiter à un espace
      tags:
