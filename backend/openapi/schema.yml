  /api/asset-versions/{id}/comments/:
    get:
      operationId: asset_versions_comments_list
      description: |-
        GET: every comment of the version (threads flattened, replies carry
        `parent`). POST: a new thread, or a reply with `parent` (commenters).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) asset version.
        required: true
      - name: page
        required: false
