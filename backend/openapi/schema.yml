            action_roles = {"resolve": Role.COMMENTER}   (per-action overrides)
            finance = "" | "rw"  ("rw": reads need can_view_finance, writes
                                  need can_edit_finance, on top of the role)

        The model's default manager must come from ProjectScopedQuerySet.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) event.
        required: true
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - following
          - this
        description: 'Récurrence : cette occurrence, ou toutes les suivantes'
      tags:
      - events
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEventRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEventRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          description: ''
    delete:
      operationId: events_destroy
      description: |-
        Mixin for viewsets whose objects belong to a project.

        Declare roles with:
            read_role   = Role.VIEWER   (list, retrieve)
            write_role  = Role.EDITOR   (create, update, partial_update, destroy)
            action_roles = {"resolve": Role.COMMENTER}   (per-action overrides)
            finance = "" | "rw"  ("rw": reads need can_view_finance, writes
                                  need can_edit_finance, on top of the role)

        The model's default manager must come from ProjectScopedQuerySet.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Un(une) valeur entière unique identifiant ce(cette) event.
        required: true
      - in: query
        name: scope
        schema:
          type: string
          enum:
          - following
          - this
        description: 'Récurrence : cette occurrence, ou toutes les suivantes'
      tags:
      - events
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
