# Lint + tests on every push and pull request.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sobased
          POSTGRES_USER: sobased
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sobased" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: ci-only
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/*.txt
      # WeasyPrint (PDF exports) needs Pango, the files app needs ffmpeg; same
      # packages as the Dockerfile.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libharfbuzz-subset0 fonts-dejavu-core ffmpeg
      - run: pip install -r requirements/dev.txt -c requirements/constraints.txt
      - run: black --check .
      - run: isort --check .
      - run: flake8
      # A model change without its migration must fail the build.
      - run: python manage.py makemigrations --check --dry-run --settings=config.settings.test
      - run: pytest
      # The committed OpenAPI schema must match the code (front types depend on it).
      - run: |
          python manage.py spectacular --file /tmp/schema.yml --settings=config.settings.test
          diff -u openapi/schema.yml /tmp/schema.yml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build
