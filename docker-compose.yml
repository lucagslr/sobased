# Development stack. Everything runs in containers so that dev takes the same
# path as production: one origin (Caddy), session cookies, X-Accel-Redirect.
# Site: http://localhost:8080
name: sobased

x-backend: &backend
  build:
    context: ./backend
    target: dev
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
  volumes:
    - ./backend:/app
    - media:/data/media
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    # Migrations run on start in dev only; production runs them in the deploy script.
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"

  # Celery does not auto-reload: `docker compose restart worker beat` after changing a task.
  worker:
    <<: *backend
    command: celery -A config worker -l info --concurrency 2

  beat:
    <<: *backend
    command: celery -A config beat -l info --schedule /tmp/celerybeat-schedule

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      # Kept in a named volume: node_modules on a Windows bind mount is very slow.
      - frontend_node_modules:/app/node_modules
      - ./backend/openapi:/openapi:ro
    command: sh -c "npm install --no-audit --no-fund && npm run dev"

  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  pgdata:
  media:
  frontend_node_modules:
